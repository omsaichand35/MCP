<!DOCTYPE html><html><head><title>Dino Game</title></head><body><canvas id="canvas" width="640" height="400"></canvas><script>var canvas = document.getElementById("canvas");var ctx = canvas.getContext("2d");var dino = {x: 100, y: 200, width: 50, height: 50};var obstacle = {x: 500, y: 250, width: 30, height: 30};var score = 0;var gravity = 0.1;var velocity = 0;function draw() {ctx.clearRect(0, 0, canvas.width, canvas.height);ctx.fillStyle = "green";ctx.fillRect(dino.x, dino.y, dino.width, dino.height);ctx.fillStyle = "red";ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);ctx.font = "24px Arial";ctx.fillStyle = "black";ctx.fillText("Score: " + score, 10, 24);}function update() {velocity += gravity;dino.y += velocity;if (dino.y + dino.height > canvas.height) {dino.y = canvas.height - dino.height;velocity = 0;}obstacle.x -= 2;if (obstacle.x < 0) {obstacle.x = canvas.width;score++;}if (checkCollision(dino, obstacle)) {alert("Game Over");}}function checkCollision(rect1, rect2) {if (rect1.x + rect1.width > rect2.x &&rect1.x < rect2.x + rect2.width &&rect1.y + rect1.height > rect2.y &&rect1.y < rect2.y + rect2.height) {return true;}return false;}document.addEventListener("keydown", function(e) {if (e.key === " " || e.key === "ArrowUp") {velocity = -6;}});setInterval(function() {update();draw();}, 1000/60);</script></body></html>
